function applySnap(m){if(!NET||m.k<=NET.k)return;NET.k=m.k;score=m.sc;capVal=m.cv;CP={x:m.cp[0],z:m.cp[1]};const seen={};let own=null;

 m.sh.forEach((a,i)=>{const o=NET.sm[i];o.x=a[0];o.z=a[1];o.vx=a[2];o.vz=a[3];o.y=a[4]});
